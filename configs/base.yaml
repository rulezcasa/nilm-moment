# Shared settings; merged base -> model -> appliance.
seed: 44
device: mps

data:
  root: data/splits
  # MOMENT's context length.
  input_length: 512
  drop_target_above_aggregate: true

# Weights & Biases
wandb:
  project: nilm-moment
  entity: NILM-MOMENT
  mode: online # online | offline | disabled
  # Upload best.pt as an artifact (not for search trials).
  log_model: true
