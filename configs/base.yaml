seed: 44 # Followed by search and train (test picks best.pt from run directory)
device: mps
target: Kettle # Kettle | Fridge-Freezer | Washing Machine
model: cnn # picks up configs/models/<model>.yaml 

search:
  name: v1 # runs/<model>/<appliance>/search-<name>; reuse to continue

test:
  split: test  # split for evaluation: test | val

data:
  root: data/splits
  input_length: 512
  drop_target_above_aggregate: true

# Weights & Biases
wandb:
  project: nilm-moment
  entity: NILM-MOMENT
  mode: online # online | offline | disabled
  # Upload best.pt as an artifact (not for search trials).
  log_model: true
