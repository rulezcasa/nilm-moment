# MOMENT-small, full fine-tuning (Goswami et al., ICML 2024), seq2point with MSE
model:
  name: moment_finetune
  checkpoint: AutonLab/MOMENT-1-small
  pretrained: true
  freeze_encoder: false
  head_dropout: 0.0

training:
  epochs: 100
  patience: 12
  num_workers: 0
  batch_size: 128
  learning_rate: 0.00005
  weight_decay: 0.0
  optimizer: adam
  precision: fp32
  loss: mse
  grad_clip_norm: 1.0
  max_windows_per_file: 100000

# Grid search
search:
  name: v2
  method: grid
  budget:
    epochs: 50
    max_windows_per_file: 30000
  space:
    learning_rate: [0.00002, 0.00003, 0.00005]

