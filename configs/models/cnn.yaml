# Sequence-to-point CNN
model:
  name: cnn
  conv_channels: [30, 30, 40, 50, 50]
  kernel_sizes: [10, 8, 6, 5, 5]
  strides: [1, 1, 1, 1, 1]
  dense_units: 1024
  dropout: 0.1

training:
  epochs: 100
  patience: 8
  num_workers: 0
  batch_size: 512
  learning_rate: 0.0003
  weight_decay: 0.0
  optimizer: adam
  loss: mse
  max_windows_per_file: 100000

# Grid search 
# search:
