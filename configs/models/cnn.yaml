# budgetted search based on previous results:
search:
  method: grid
  budget:
    epochs: 50
    max_windows_per_file: 30000
  space:
    learning_rate: [0.0003, 0.001]
    dense_units: [1024]
    dropout: [0.0, 0.1, 0.2]

