# MOMENT backbone with a sequence-to-point head (Goswami et al., 2024).
# Starting values; finalize the keys when src/models/moment_s2p.py is implemented.
model:
  name: moment
  checkpoint: AutonLab/MOMENT-1-large
  freeze_backbone: true
  head_dropout: 0.1

training:
  batch_size: 64
  learning_rate: 0.00001
  weight_decay: 0.0
  optimizer: adam
  loss: mse
